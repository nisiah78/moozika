; Limites pour l'upload de partitions (POST /transcriptions).
;
; L'image php:8.3-cli ne charge AUCUN php.ini par defaut : on heritait donc de
; upload_max_filesize=2M et post_max_size=8M, alors qu'un simple PDF de theorie du
; depot fait deja 5,25 Mo et qu'un recueil scanne de 10 pages depasse largement.
; Au-dela de la limite, PHP jette le fichier en silence — l'upload semble reussir
; cote client et $request->files est vide.
upload_max_filesize = 64M
post_max_size = 64M

; Le worker relit la source depuis MinIO puis la reposte en multipart vers
; omr-service : le contenu existe donc en memoire plus d'une fois.
memory_limit = 512M
